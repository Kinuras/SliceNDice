<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Slash Runner</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080811;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: linear-gradient(180deg, #100f24 0%, #05050c 100%);
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }
        canvas {
            display: block;
            width: 100%;
            flex: 1;
            touch-action: none;
        }
        /* Touch Control Deck */
        #control-deck {
            height: 140px;
            background: rgba(10, 10, 20, 0.95);
            border-top: 2px solid rgba(0, 255, 255, 0.2);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 20px;
            z-index: 5;
        }
        .control-btn {
            flex: 1;
            max-width: 180px;
            height: 90px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            transition: transform 0.05s, box-shadow 0.05s, background 0.1s;
        }
        .control-btn:active {
            transform: scale(0.95);
        }
        #jump-btn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            box-shadow: 0 6px 20px rgba(0, 198, 255, 0.4);
            margin-right: 15px;
        }
        #jump-btn:active {
            box-shadow: 0 2px 10px rgba(0, 198, 255, 0.4);
        }
        #slice-btn {
            background: linear-gradient(135deg, #f12711 0%, #f5af19 100%);
            box-shadow: 0 6px 20px rgba(241, 39, 17, 0.4);
            margin-left: 15px;
        }
        #slice-btn:active {
            box-shadow: 0 2px 10px rgba(241, 39, 17, 0.4);
        }
        .control-btn span {
            font-size: 0.85rem;
            font-weight: normal;
            opacity: 0.8;
            margin-top: 4px;
        }

        /* Overlays */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 12, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .screen.hidden {
            display: none !important;
        }
        h1 {
            font-size: 2.4rem;
            margin: 0 0 10px 0;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(0, 255, 255, 0.4);
        }
        p {
            color: #aaa;
            font-size: 1rem;
            margin: 0 0 25px 0;
            line-height: 1.5;
            max-width: 340px;
        }
        .btn {
            background: linear-gradient(135deg, #00ffff 0%, #0072ff 100%);
            color: #000;
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-box .label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 4px;
        }
        .stat-box .value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #00ffff;
        }

        /* HUD Overlay on Canvas */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .hud-badge {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Canvas HUD -->
        <div id="hud">
            <div class="hud-badge" id="score-display">SCORE: 0</div>
            <div class="hud-badge" id="speed-display">⚡ 1.0X</div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Touch Controls Deck -->
        <div id="control-deck">
            <button class="control-btn" id="jump-btn">
                ▲ JUMP
                <span>Avoid Ground Hazards</span>
            </button>
            <button class="control-btn" id="slice-btn">
                ⚔️ SLICE
                <span>Destroy Drones & Shards</span>
            </button>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>CYBER SLASH</h1>
            <p>Sprint across the neon skyline. Use <b>JUMP</b> to clear ground hazards and pits, and <b>SLICE</b> to obliterate flying security drones and data-shards!</p>
            <button class="btn" id="start-btn">INITIALIZE RUN</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <h1>SYSTEM CRASH</h1>
            <p>Your neural connection was severed.</p>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="label">Final Score</div>
                    <div class="value" id="final-score">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">Distance Run</div>
                    <div class="value" id="final-dist">0m</div>
                </div>
            </div>
            <button class="btn" id="restart-btn">REBOOT SYSTEM</button>
        </div>
    </div>

    <script>
        // --- WEB AUDIO API SOUND SYSTEM ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'jump') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'slice') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.linearRampToValueAtTime(40, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } else if (type === 'score') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.setValueAtTime(880, now + 0.08); // A5
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch(e) {}
        }

        // --- GAME ENGINE & SETUP ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            const container = document.getElementById('game-container');
            const deck = document.getElementById('control-deck');
            width = container.clientWidth;
            height = container.clientHeight - deck.offsetHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // Game States
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let distance = 0;
        let gameSpeed = 6;
        let baseSpeed = 6;

        // Player Object
        const player = {
            x: 70,
            y: 0,
            width: 36,
            height: 52,
            vy: 0,
            isJumping: false,
            isSlashing: false,
            slashTimer: 0,
            groundY: 0
        };

        let obstacles = [];
        let particles = [];
        let floatingTexts = [];
        let buildings = []; // Background skyline
        let stars = [];

        function initEnvironment() {
            player.groundY = height - 70;
            player.y = player.groundY - player.height;

            buildings = [];
            for (let i = 0; i < 6; i++) {
                buildings.push({
                    x: i * 120,
                    w: 90 + Math.random() * 40,
                    h: 150 + Math.random() * 180,
                    color: `hsl(${220 + Math.random() * 40}, 30%, ${10 + Math.random() * 8}%)`
                });
            }

            stars = [];
            for (let i = 0; i < 30; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * (height - 100),
                    size: Math.random() * 2 + 1,
                    alpha: Math.random()
                });
            }
        }

        // --- GAME CONTROLS ---
        function handleJump() {
            if (gameState !== 'PLAYING') return;
            initAudio();
            if (!player.isJumping) {
                player.vy = -12.5;
                player.isJumping = true;
                playSound('jump');
                createJumpParticles();
            }
        }

        function handleSlice() {
            if (gameState !== 'PLAYING') return;
            initAudio();
            if (!player.isSlashing) {
                player.isSlashing = true;
                player.slashTimer = 18; // frames of blade active
                playSound('slice');

                // Check collisions with active obstacles for slicing!
                obstacles.forEach(obs => {
                    if (!obs.sliced && obs.type !== 'pit') {
                        const dist = Math.hypot((player.x + player.width/2) - (obs.x + obs.width/2), (player.y + player.height/2) - (obs.y + obs.height/2));
                        if (dist < 85) {
                            obs.sliced = true;
                            score += obs.type === 'drone' ? 300 : 150;
                            playSound('score');
                            createExplosion(obs.x + obs.width/2, obs.y + obs.height/2, '#00ffff');
                            addFloatingText(`+${obs.type === 'drone' ? 300 : 150}`, obs.x, obs.y, '#00ffff');
                        }
                    }
                });
            }
        }

        // Event Listeners for Touch/Mouse Buttons
        const jumpBtn = document.getElementById('jump-btn');
        const sliceBtn = document.getElementById('slice-btn');

        jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); handleJump(); });
        sliceBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); handleSlice(); });

        // Keyboard Support (Space/ArrowUp for Jump, KeyX/KeyF for Slice)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                e.preventDefault();
                handleJump();
            } else if (e.code === 'KeyX' || e.code === 'KeyF' || e.code === 'KeyS') {
                e.preventDefault();
                handleSlice();
            }
        });

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        function startGame() {
            initAudio();
            score = 0;
            distance = 0;
            gameSpeed = 6;
            obstacles = [];
            particles = [];
            floatingTexts = [];
            initEnvironment();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            gameState = 'PLAYING';
        }

        function endGame() {
            gameState = 'GAMEOVER';
            playSound('crash');
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-dist').innerText = `${Math.floor(distance)}m`;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        // --- SPAWNER ---
        let spawnTimer = 0;
        function spawnObstacle() {
            const types = ['barrier', 'drone', 'shard'];
            const chosen = types[Math.floor(Math.random() * types.length)];
            
            let obs = {
                x: width + 50,
                y: player.groundY - 45,
                width: 40,
                height: 45,
                type: chosen,
                sliced: false
            };

            if (chosen === 'drone') {
                obs.y = player.groundY - 110; // floating high, must slice
                obs.width = 46;
                obs.height = 36;
            } else if (chosen === 'shard') {
                obs.y = player.groundY - 80; // floating collectible shard
                obs.width = 30;
                obs.height = 30;
            } else {
                // barrier on floor, must jump
                obs.height = 50;
            }

            obstacles.push(obs);
        }

        // --- PARTICLES & EFFECTS ---
        function createJumpParticles() {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: player.x + player.width/2,
                    y: player.groundY,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * -3,
                    radius: Math.random() * 3 + 1,
                    color: '#00ffff',
                    alpha: 1.0,
                    decay: 0.05
                });
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 7 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1.0,
                    decay: 0.04
                });
            }
        }

        function addFloatingText(text, x, y, color) {
            floatingTexts.push({
                text: text,
                x: x,
                y: y,
                vy: -1.2,
                alpha: 1.0,
                color: color
            });
        }

        // --- GAME LOOP ---
        let lastTime = 0;
        function update(timestamp) {
            if (gameState === 'PLAYING') {
                // Progression
                distance += gameSpeed * 0.05;
                score += Math.floor(gameSpeed * 0.1);
                gameSpeed = baseSpeed + Math.floor(distance / 120) * 0.6;

                document.getElementById('score-display').innerText = `SCORE: ${score}`;
                document.getElementById('speed-display').innerText = `⚡ ${(gameSpeed / baseSpeed).toFixed(1)}X`;

                // Spawning
                spawnTimer += gameSpeed;
                if (spawnTimer > 110) {
                    spawnObstacle();
                    spawnTimer = 0;
                }

                // Player Physics (Gravity & Jump)
                player.vy += 0.65;
                player.y += player.vy;
                if (player.y >= player.groundY - player.height) {
                    player.y = player.groundY - player.height;
                    player.vy = 0;
                    player.isJumping = false;
                }

                // Slash Timer
                if (player.isSlashing) {
                    player.slashTimer--;
                    if (player.slashTimer <= 0) player.isSlashing = false;
                }

                // Update Obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= gameSpeed;

                    // Check Shard pickup
                    if (!obs.sliced && obs.type === 'shard') {
                        const dist = Math.hypot((player.x + player.width/2) - (obs.x + obs.width/2), (player.y + player.height/2) - (obs.y + obs.height/2));
                        if (dist < 40) {
                            obs.sliced = true;
                            score += 500;
                            playSound('score');
                            createExplosion(obs.x, obs.y, '#ff00ff');
                            addFloatingText('+500 SHARD!', obs.x, obs.y, '#ff00ff');
                        }
                    }

                    // Collision detection with obstacles if not sliced
                    if (!obs.sliced && obs.type !== 'shard') {
                        // AABB Collision with forgiveness margin
                        if (
                            player.x + 8 < obs.x + obs.width - 8 &&
                            player.x + player.width - 8 > obs.x + 8 &&
                            player.y + 8 < obs.y + obs.height - 8 &&
                            player.y + player.height - 4 > obs.y + 8
                        ) {
                            endGame();
                        }
                    }

                    // Remove off-screen obstacles
                    if (obs.x < -60) {
                        obstacles.splice(i, 1);
                    }
                }

                // Update Background Buildings
                buildings.forEach(b => {
                    b.x -= gameSpeed * 0.35;
                    if (b.x + b.w < 0) {
                        b.x = width + Math.random() * 50;
                        b.w = 90 + Math.random() * 40;
                        b.h = 150 + Math.random() * 180;
                    }
                });

                // Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) particles.splice(i, 1);
                }

                // Update Floating Texts
                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    let ft = floatingTexts[i];
                    ft.y += ft.vy;
                    ft.alpha -= 0.02;
                    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
                }
            }

            render();
            requestAnimationFrame(update);
        }

        // --- RENDER SYSTEM ---
        function render() {
            ctx.clearRect(0, 0, width, height);

            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.globalAlpha = s.alpha;
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });
            ctx.globalAlpha = 1.0;

            // Draw Skyline Buildings
            buildings.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, height - 70 - b.h, b.w, b.h);
                // Windows glow
                ctx.fillStyle = 'rgba(0, 255, 255, 0.15)';
                for (let wx = b.x + 10; wx < b.x + b.w - 10; wx += 16) {
                    for (let wy = height - 70 - b.h + 20; wy < height - 90; wy += 25) {
                        ctx.fillRect(wx, wy, 8, 12);
                    }
                }
            });

            // Draw Neon Ground Floor
            ctx.fillStyle = '#121224';
            ctx.fillRect(0, player.groundY, width, height - player.groundY);
            
            ctx.strokeStyle = '#00ffff';
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 12;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, player.groundY);
            ctx.lineTo(width, player.groundY);
            ctx.stroke();
            ctx.shadowBlur = 0; // reset

            // Draw Ground Grid Perspective Lines
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            const gridOffset = (distance * 15) % 40;
            for (let gx = -gridOffset; gx < width; gx += 40) {
                ctx.beginPath();
                ctx.moveTo(gx, player.groundY);
                ctx.lineTo(gx - 40, height);
                ctx.stroke();
            }

            // Draw Obstacles
            obstacles.forEach(obs => {
                if (obs.sliced) return;

                ctx.save();
                if (obs.type === 'drone') {
                    // Security Drone
                    ctx.shadowColor = '#ff0055';
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = '#ff0055';
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                    // Rotor glow
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(obs.x + 4, obs.y + 4, obs.width - 8, 6);
                } else if (obs.type === 'shard') {
                    // Data Shard Crystal
                    ctx.shadowColor = '#ff00ff';
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = '#ff00ff';
                    ctx.beginPath();
                    ctx.arc(obs.x + obs.width/2, obs.y + obs.height/2, obs.width/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '14px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('💎', obs.x + obs.width/2, obs.y + obs.height/2);
                } else {
                    // Floor Cyber Barrier
                    ctx.shadowColor = '#00ffff';
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = '#0a0a1a';
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 2;
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                    ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

                    // Inner laser hazard lines
                    ctx.fillStyle = '#00ffff';
                    ctx.fillRect(obs.x + 6, obs.y + 10, obs.width - 12, 4);
                    ctx.fillRect(obs.x + 6, obs.y + 26, obs.width - 12, 4);
                }
                ctx.restore();
            });

            // Draw Player (Cyber Runner)
            ctx.save();
            ctx.shadowColor = '#00ffff';
            ctx.shadowBlur = 15;
            
            // Body
            ctx.fillStyle = '#00ffff';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Visor
            ctx.fillStyle = '#ff00ff';
            ctx.fillRect(player.x + 16, player.y + 10, 16, 8);

            // Active Sword Arc if Slashing
            if (player.isSlashing) {
                ctx.strokeStyle = '#ffffff';
                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 20;
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(player.x + player.width + 10, player.y + player.height/2, 35, -Math.PI/2, Math.PI/2);
                ctx.stroke();
            }
            ctx.restore();

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Floating Texts
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.font = 'bold 18px sans-serif';
                ctx.fillStyle = ft.color;
                ctx.shadowColor = ft.color;
                ctx.shadowBlur = 10;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });
        }

        // Start render loop
        requestAnimationFrame(update);
    </script>
</body>
</html>
