<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katamari Roll</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #090912;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: linear-gradient(135deg, #131324 0%, #06060d 100%);
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
            cursor: pointer;
        }

        /* Top HUD */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
        }
        .hud-badge {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 1px;
        }

        /* Overlays */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 6, 13, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        .screen.hidden {
            display: none !important;
        }
        h1 {
            font-size: 2.4rem;
            margin: 0 0 10px 0;
            background: linear-gradient(45deg, #ff007f, #7f00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
        }
        p {
            color: #aaa;
            font-size: 1rem;
            margin: 0 0 25px 0;
            line-height: 1.5;
            max-width: 340px;
        }
        .btn {
            background: linear-gradient(135deg, #ff007f 0%, #7f00ff 100%);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
            transition: transform 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-box .label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 4px;
        }
        .stat-box .value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff007f;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Canvas HUD -->
        <div id="hud">
            <div class="hud-badge" id="score-display">SCORE: 0</div>
            <div class="hud-badge" id="size-display">SIZE: 1.0x</div>
            <div class="hud-badge" id="timer-display">⏱️ 45s</div>
        </div>

        <!-- Canvas -->
        <canvas id="gameCanvas"></canvas>

        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>KATAMARI ROLL</h1>
            <p>Drag your finger or mouse anywhere on the screen to roll your sphere. Absorb smaller neon objects to grow bigger before time runs out!</p>
            <button class="btn" id="start-btn">START ROLLING</button>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <h1>TIME'S UP!</h1>
            <p>Look at how much mass you collected!</p>
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="label">Final Score</div>
                    <div class="value" id="final-score">0</div>
                </div>
                <div class="stat-box">
                    <div class="label">Max Size</div>
                    <div class="value" id="final-size">1.0x</div>
                </div>
            </div>
            <button class="btn" id="restart-btn">ROLL AGAIN</button>
        </div>
    </div>

    <script>
        // --- WEB AUDIO API SOUND SYSTEM ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type, pitchMultiplier = 1.0) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'absorb') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(300 * pitchMultiplier, now);
                    osc.frequency.exponentialRampToValueAtTime(600 * pitchMultiplier, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'grow') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(261.63, now); // C4
                    osc.frequency.setValueAtTime(329.63, now + 0.1); // E4
                    osc.frequency.setValueAtTime(392.00, now + 0.2); // G4
                    osc.frequency.setValueAtTime(523.25, now + 0.3); // C5
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                }
            } catch(e) {}
        }

        // --- GAME SETUP & CONSTANTS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            const container = document.getElementById('game-container');
            width = container.clientWidth;
            height = container.clientHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // Game States
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let timeLeft = 45;
        let gameTimer = null;

        // Player (Katamari Ball)
        const player = {
            x: 0,
            y: 0,
            radius: 22,
            vx: 0,
            vy: 0,
            targetX: null,
            targetY: null
        };

        let objects = [];
        let particles = [];
        let floatingTexts = [];

        // Item templates
        const ITEM_TYPES = [
            { name: 'Pin', emoji: '📍', radius: 10, value: 10, tier: 1 },
            { name: 'Star', emoji: '⭐', radius: 14, value: 25, tier: 1 },
            { name: 'Cube', emoji: '🧊', radius: 18, value: 40, tier: 2 },
            { name: 'Donut', emoji: '🍩', radius: 22, value: 70, tier: 2 },
            { name: 'Gem', emoji: '💎', radius: 28, value: 120, tier: 3 },
            { name: 'Robot', emoji: '🤖', radius: 36, value: 250, tier: 4 },
            { name: 'Rocket', emoji: '🚀', radius: 46, value: 500, tier: 5 }
        ];

        function initGameData() {
            player.x = width / 2;
            player.y = height / 2;
            player.radius = 22;
            player.vx = 0;
            player.vy = 0;
            player.targetX = null;
            player.targetY = null;
            score = 0;
            timeLeft = 45;
            objects = [];
            particles = [];
            floatingTexts = [];

            // Spawn initial map items
            for (let i = 0; i < 45; i++) {
                spawnRandomObject();
            }
        }

        function spawnRandomObject() {
            // Determine tier based on player size
            const currentTier = Math.min(5, Math.max(1, Math.floor(player.radius / 18)));
            const availableTypes = ITEM_TYPES.filter(t => t.tier <= currentTier + 1);
            const template = availableTypes[Math.floor(Math.random() * availableTypes.length)];

            // Keep away from player spawn initially
            let x, y, dist;
            do {
                x = Math.random() * (width - 80) + 40;
                y = Math.random() * (height - 80) + 40;
                dist = Math.hypot(x - player.x, y - player.y);
            } while (dist < 100);

            objects.push({
                x: x,
                y: y,
                radius: template.radius,
                template: template,
                rotation: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 0.05
            });
        }

        // --- CONTROLS / INPUT ---
        let isTouching = false;

        function updateTargetPos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            player.targetX = clientX - rect.left;
            player.targetY = clientY - rect.top;
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (gameState !== 'PLAYING') return;
            initAudio();
            isTouching = true;
            updateTargetPos(e.clientX, e.clientY);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isTouching || gameState !== 'PLAYING') return;
            updateTargetPos(e.clientX, e.clientY);
        });

        window.addEventListener('pointerup', () => {
            isTouching = false;
            player.targetX = null;
            player.targetY = null;
        });

        // --- GAME START & END ---
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);

        function startGame() {
            initAudio();
            initGameData();

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            gameState = 'PLAYING';

            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                if (gameState === 'PLAYING') {
                    timeLeft--;
                    document.getElementById('timer-display').innerText = `⏱️ ${timeLeft}s`;
                    if (timeLeft <= 0) {
                        endGame();
                    }
                }
            }, 1000);
        }

        function endGame() {
            gameState = 'GAMEOVER';
            clearInterval(gameTimer);
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-size').innerText = `${(player.radius / 22).toFixed(1)}x`;
            document.getElementById('gameover-screen').classList.remove('hidden');
        }

        // --- EFFECTS ---
        function createParticles(x, y, color) {
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 1;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: Math.random() * 3 + 1,
                    color: color,
                    alpha: 1.0,
                    decay: 0.05
                });
            }
        }

        function addFloatingText(text, x, y, color) {
            floatingTexts.push({
                text: text,
                x: x,
                y: y,
                vy: -1.2,
                alpha: 1.0,
                color: color
            });
        }

        // --- GAME LOOP ---
        function update() {
            if (gameState === 'PLAYING') {
                // Movement physics towards target drag point
                if (player.targetX !== null && player.targetY !== null) {
                    const dx = player.targetX - player.x;
                    const dy = player.targetY - player.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist > 5) {
                        const speed = 4.2;
                        player.vx = (dx / dist) * speed;
                        player.vy = (dy / dist) * speed;
                    } else {
                        player.vx *= 0.8;
                        player.vy *= 0.8;
                    }
                } else {
                    player.vx *= 0.9;
                    player.vy *= 0.9;
                }

                player.x += player.vx;
                player.y += player.vy;

                // Screen boundaries clamp
                const margin = player.radius;
                player.x = Math.max(margin, Math.min(width - margin, player.x));
                player.y = Math.max(margin, Math.min(height - margin, player.y));

                // Check collisions with objects on map
                for (let i = objects.length - 1; i >= 0; i--) {
                    let obj = objects[i];
                    obj.rotation += obj.vRot;

                    const dist = Math.hypot(player.x - obj.x, player.y - obj.y);
                    // If player is bigger than object, absorb it!
                    if (dist < player.radius + obj.radius * 0.6) {
                        if (player.radius >= obj.radius * 0.85) {
                            // Absorbed!
                            score += obj.template.value;
                            
                            // Grow Katamari slightly
                            const oldRadius = player.radius;
                            player.radius += obj.radius * 0.08;
                            
                            playSound('absorb', Math.max(0.5, 1.3 - (player.radius / 80)));
                            createParticles(obj.x, obj.y, '#ff007f');
                            addFloatingText(`+${obj.template.value}`, obj.x, obj.y, '#00ffff');

                            // Check size milestone grow sound
                            if (Math.floor(player.radius / 15) > Math.floor(oldRadius / 15)) {
                                playSound('grow');
                            }

                            document.getElementById('score-display').innerText = `SCORE: ${score}`;
                            document.getElementById('size-display').innerText = `SIZE: ${(player.radius / 22).toFixed(1)}x`;

                            // Remove and spawn replacement
                            objects.splice(i, 1);
                            spawnRandomObject();
                        }
                    }
                }

                // Maintain object count
                while (objects.length < 45) {
                    spawnRandomObject();
                }

                // Update Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) particles.splice(i, 1);
                }

                // Update Floating Texts
                for (let i = floatingTexts.length - 1; i >= 0; i--) {
                    let ft = floatingTexts[i];
                    ft.y += ft.vy;
                    ft.alpha -= 0.02;
                    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
                }
            }

            render();
            requestAnimationFrame(update);
        }

        // --- RENDER SYSTEM ---
        function render() {
            ctx.clearRect(0, 0, width, height);

            // Background Grid Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Draw Map Objects
            objects.forEach(obj => {
                ctx.save();
                ctx.translate(obj.x, obj.y);
                ctx.rotate(obj.rotation);

                // Highlight if absorbable by player
                const canEat = player.radius >= obj.radius * 0.85;

                ctx.font = `${obj.radius * 1.3}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                if (!canEat) {
                    ctx.globalAlpha = 0.5; // too big to eat yet
                }

                ctx.fillText(obj.template.emoji, 0, 0);
                ctx.restore();
            });

            // Draw Player Katamari Ball
            ctx.save();
            ctx.translate(player.x, player.y);

            // Outer Neon Glow
            ctx.shadowColor = '#ff007f';
            ctx.shadowBlur = 20;
            ctx.fillStyle = '#1a0033';
            ctx.strokeStyle = '#ff007f';
            ctx.lineWidth = 4;

            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Inner spinning pattern / core
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.arc(0, 0, player.radius * 0.4, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();

            // Draw Particles
            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            // Draw Floating Texts
            floatingTexts.forEach(ft => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, ft.alpha);
                ctx.font = 'bold 16px sans-serif';
                ctx.fillStyle = ft.color;
                ctx.shadowColor = ft.color;
                ctx.shadowBlur = 8;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.restore();
            });
        }

        // Start render loop
        requestAnimationFrame(update);
    </script>
</body>
</html>
